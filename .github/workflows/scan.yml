name: setup-scan
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: setup-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run scanner once
        env:
          SCAN_PAIRS: XAUUSD,R_75,stpRNG
          SCAN_DATA_DIR: out
        run: |
          mkdir -p out
          cp setups out/setups.json
          node scan.cjs --once
          cp out/setups.json setups
      - name: Commit results
        run: |
          git config user.name "setup-scanner"
          git config user.email "setup-scanner@users.noreply.github.com"
          git add setups
          git diff --cached --quiet || (git commit -m "scan $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push)
